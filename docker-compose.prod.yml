# Production stack. Run on the server with:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (80/443); every other service is on the internal network.
name: wishtrip

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://wishtrip:${POSTGRES_PASSWORD}@postgres:5432/wishtrip
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /data/media

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wishtrip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wishtrip
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishtrip -d wishtrip"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
             --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./client_work/knowledge_base:/client_work/knowledge_base:ro
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment: *backend-env
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - media:/data/media
    depends_on:
      backend:
        condition: service_started

  # Reel imports: Instagram download, ffmpeg and OCR. One at a time, on their own queue.
  media-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment: *backend-env
    command: celery -A app.workers.celery_app worker -Q media --loglevel=info --concurrency=1 -n media@%h
    volumes:
      - media:/data/media
      # The Instagram login session: private, never under the public media folder.
      - instaloader:/data/instaloader
    depends_on:
      backend:
        condition: service_started

  # Serves the staff dashboard (DASHBOARD_DOMAIN) AND the SSO login (SSO_DOMAIN), host-based.
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      # SSO: one session shared across every app on the parent domain (e.g. .listnr.co).
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      SSO_URL: ${SSO_URL}
      POST_LOGIN_FALLBACK_URL: ${POST_LOGIN_FALLBACK_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

  # Serves the traveler website (WEBSITE_DOMAIN) AND the creator site (CREATOR_DOMAIN), host-based.
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      # SSO: share the session cookie and send sign-in to the SSO app.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      SSO_URL: ${SSO_URL}
      # The creator portal's own host, served by this same app (CREATOR_DOMAIN is Caddy's).
      CREATOR_URL: https://${CREATOR_DOMAIN}
      # Private preview: /gate asks for these. The gate stays on until SITE_PUBLIC=true (launch).
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      SITE_PUBLIC: ${SITE_PUBLIC:-false}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN}
      CREATOR_DOMAIN: ${CREATOR_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      SSO_DOMAIN: ${SSO_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - dashboard
      - backend

volumes:
  pgdata:
  media:
  instaloader:
  caddy_data:
  caddy_config:
